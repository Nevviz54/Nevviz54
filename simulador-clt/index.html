<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador CLT ES — O Peso da Carteira</title>
<style>
/* ============================================================
   SIMULADOR CLT ES — folha de estilo
   Sem dependencias externas: nada de CDN, nada de fonte remota.
   ============================================================ */
:root{
  --bg:#0a0a0c; --bg2:#111116; --panel:#16161c; --panel2:#1d1d25;
  --line:#2a2a35; --line2:#3a3a48;
  --txt:#f2f2f5; --dim:#9a9aa8; --dim2:#6a6a78;
  --acc:#ffd23f; --ok:#3ddc84; --bad:#ff5d5d; --warn:#ff9f43;
  --blue:#4dabf7; --purple:#b197fc; --pink:#ff6b9d;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); min-height:100vh;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15}
p{margin:0 0 .6em}

/* CRT / scanlines opcional */
#crt{position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,.16) 50%);
  background-size:100% 3px; opacity:.6}
body.no-crt #crt{display:none}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.hide{display:none !important}
.grid-main{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:1000px){ .grid-main{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)} }

/* ---------- componentes ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--panel2)}
.card-h h3{font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim)}
.card-b{padding:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--txt);
  padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;
  transition:background .12s,border-color .12s,transform .06s;text-align:left}
.btn:hover:not(:disabled){background:#282833;border-color:#4a4a5c}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn-p{background:var(--acc);color:#141400;border-color:#e0b400}
.btn-p:hover:not(:disabled){background:#ffdf6b}
.btn-ok{background:#12341f;border-color:#1f6b3c;color:#9df0bd}
.btn-ok:hover:not(:disabled){background:#17422a}
.btn-bad{background:#3a1414;border-color:#7a2626;color:#ffb3b3}
.btn-bad:hover:not(:disabled){background:#4a1a1a}
.btn-lg{padding:16px 22px;font-size:17px;border-radius:12px}
.btn-block{width:100%}

.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);
  border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tag.ok{border-color:#1f6b3c;color:var(--ok)}
.tag.bad{border-color:#7a2626;color:var(--bad)}
.tag.acc{border-color:#7a6410;color:var(--acc)}
.tag.blue{border-color:#1c4f7a;color:var(--blue)}

.bar{height:8px;background:#26262f;border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.stat{display:flex;flex-direction:column;gap:5px}
.stat .lbl{display:flex;justify-content:space-between;font-size:11px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--dim)}
.row b{font-variant-numeric:tabular-nums}

.muted{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-acc{color:var(--acc)} .c-warn{color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:12px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- HUD ---------- */
.hud{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){ .hud{grid-template-columns:repeat(3,1fr)} }
@media(min-width:1000px){ .hud{grid-template-columns:repeat(6,1fr)} }
.hud .card-b{padding:11px 13px}
.hud .big{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- cena 2D ---------- */
.scene-box{position:relative;background:#05050a;border-bottom:1px solid var(--line)}
#scene{display:block;width:100%;height:auto;image-rendering:pixelated}
.scene-tags{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.scene-tags .tag{background:rgba(6,6,12,.7);backdrop-filter:blur(2px)}
.bubble{position:absolute;right:10px;top:10px;max-width:52%;background:rgba(6,6,12,.82);
  border:1px solid var(--line2);border-radius:10px;padding:7px 11px;font-size:12px;color:#dcdce6;
  opacity:0;transition:opacity .3s}
.bubble.on{opacity:1}

/* ---------- abas de acao ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line2);background:transparent;color:var(--dim);
  padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer}
.tab:hover{color:var(--txt);background:var(--panel2)}
.tab.on{background:var(--txt);color:#0a0a0c;border-color:var(--txt)}
.acts{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:560px){ .acts{grid-template-columns:1fr 1fr} }
@media(min-width:1240px){ .acts{grid-template-columns:1fr 1fr 1fr} }
.act{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:92px;padding:11px 13px}
.act .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.act .t .em{font-size:17px;line-height:1}
.act .d{font-size:11.5px;color:var(--dim);line-height:1.4}
.act .m{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.chip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line2);color:var(--dim2);white-space:nowrap}
.chip.up{color:var(--ok);border-color:#1f5b36}
.chip.dn{color:var(--bad);border-color:#6a2222}
.chip.pa{color:var(--acc);border-color:#6a5810}

/* ---------- log ---------- */
.log{display:flex;flex-direction:column;gap:7px;max-height:330px;overflow-y:auto;padding-right:6px}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-track{background:#101015}
.log::-webkit-scrollbar-thumb{background:#33333f;border-radius:99px}
.log .e{border:1px solid var(--line);background:#101015;border-radius:9px;padding:8px 10px;font-size:12.2px;color:#c5c5d0}
.log .e b{color:var(--txt)}
.log .e.up{border-left:3px solid var(--ok)}
.log .e.dn{border-left:3px solid var(--bad)}
.log .e.ev{border-left:3px solid var(--purple)}
.log .e.mo{border-left:3px solid var(--acc)}

/* ---------- modal / popup ---------- */
.veil{position:fixed;inset:0;z-index:9000;background:rgba(4,4,8,.78);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.veil .card{width:100%;max-width:520px;animation:pop .18s ease-out}
.veil.wide .card{max-width:760px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
body.reduce-motion .veil .card{animation:none}

/* ---------- dados ---------- */
.dice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.die{width:48px;height:48px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;color:var(--acc)}
.die.rolling{animation:shake .35s infinite}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,-3px) rotate(-7deg)}
  50%{transform:translate(2px,2px) rotate(6deg)}75%{transform:translate(-1px,2px) rotate(-3deg)}}
body.reduce-motion .die.rolling{animation:none}
.rollline{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline;font-size:13.5px}
.rollline .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}

/* ---------- minigames ---------- */
.mg-canvas{width:100%;background:#07070d;border:1px solid var(--line);border-radius:10px;display:block}
.mg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mg-cell{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:#101018;
  display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none}
.mg-cell.on{background:#2a2410;border-color:var(--acc)}
.mg-cell.bad{background:#2a1010;border-color:var(--bad)}
.mg-opts{display:flex;flex-direction:column;gap:8px}
.mg-num{font-size:30px;font-weight:900;text-align:center;padding:14px 0;letter-spacing:.02em}

/* ---------- listas / holerite ---------- */
.pay{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pay .h{background:var(--panel2);padding:8px 12px;font-size:11.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pay .l{display:flex;justify-content:space-between;padding:6px 12px;font-size:13px;border-top:1px solid var(--line)}
.pay .l.tot{background:#101015;font-weight:800}

.cities{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){ .cities{grid-template-columns:repeat(3,1fr)} }
.city{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px}
.city .n{font-weight:700;font-size:13px}

.help h4{margin:16px 0 6px;font-size:14px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.help h4:first-child{margin-top:0}
.help ul{margin:0 0 8px;padding-left:20px}
.help li{margin-bottom:4px;font-size:13.5px;color:#c9c9d4}
.help code{background:#101018;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}

/* ---------- escala de fonte (menu de opcoes) ---------- */
body.fonte-p{font-size:13.5px}
body.fonte-g{font-size:16.5px}

/* ---------- abertura da D.F.B.G PRODUCTIONS ---------- */
.splash{position:fixed;inset:0;z-index:9600;background:#050508;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-direction:column}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:20px;
  animation:sp-abre .5s ease-out both, sp-fecha .5s ease-in 1.9s both}
.splash-cima{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#5a5a68;
  animation:sp-sobe .7s ease-out both}
.selo{display:flex;flex-direction:column;align-items:center;gap:9px;padding:26px 38px;
  border:2px solid #2a2a35;border-radius:6px;position:relative;background:#0a0a0e}
.selo::before,.selo::after{content:"";position:absolute;width:9px;height:9px;
  border:2px solid var(--acc)}
.selo::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.selo::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.selo-letras{font-size:clamp(30px,8vw,56px);font-weight:900;color:#f2f2f5;line-height:1;
  animation:sp-letras 1s cubic-bezier(.2,.7,.3,1) both}
.selo-linha{height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--acc),transparent);
  animation:sp-linha .8s ease-out .3s both}
.selo-sub{font-size:clamp(10px,2.6vw,13px);font-weight:700;letter-spacing:.5em;
  color:var(--acc);padding-left:.5em;animation:sp-sobe .8s ease-out .45s both}
.splash-pular{position:fixed;bottom:26px;left:0;right:0;text-align:center;font-size:11px;
  color:#3a3a48;letter-spacing:.14em;text-transform:uppercase;animation:sp-abre .6s 1.1s both}
@keyframes sp-abre{from{opacity:0}to{opacity:1}}
@keyframes sp-fecha{from{opacity:1}to{opacity:0}}
@keyframes sp-sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sp-letras{from{opacity:0;letter-spacing:.6em}to{opacity:1;letter-spacing:.1em}}
@keyframes sp-linha{from{transform:scaleX(0)}to{transform:scaleX(1)}}
body.reduce-motion .splash *{animation:none !important;opacity:1 !important;
  transform:none !important;letter-spacing:.1em}

/* ---------- rolagem sequencial dos dados ---------- */
.rol-linha{display:flex;align-items:center;gap:14px;padding:11px 4px;
  border-bottom:1px solid var(--line);transition:opacity .3s}
.rol-linha:last-child{border-bottom:0}
.rol-linha.apagada{opacity:.32}
.d12{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:900;color:#0a0a0c;line-height:1;
  clip-path:polygon(50% 2%,97% 36%,79% 94%,21% 94%,3% 36%);transition:background .3s}
.d12.girando{animation:d12-gira .28s linear infinite}
@keyframes d12-gira{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-9deg) scale(1.07)}
  50%{transform:rotate(0) scale(.95)}75%{transform:rotate(9deg) scale(1.07)}
  100%{transform:rotate(0) scale(1)}}
body.reduce-motion .d12.girando{animation:none}
.rol-txt{min-width:0;flex:1}
.rol-rot{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.rol-res{font-size:15px;font-weight:700;margin-top:2px;line-height:1.25}
.rol-sub{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.35}
@media(max-width:640px){ .d12{width:46px;height:46px;font-size:18px} .rol-res{font-size:14px} }

/* ---------- menu de opcoes ---------- */
.opc-grupo{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--acc);margin:18px 0 2px}
.opc-grupo:first-child{margin-top:0}
.opc-linha{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.opc-linha:last-child{border-bottom:0}
.opc-linha .txt{flex:1;min-width:0}
.opc-linha .nome{font-weight:600;font-size:13.5px}
.opc-linha .desc{font-size:11.5px;color:var(--dim2);margin-top:2px;line-height:1.4}
.opc-ctrl{display:flex;align-items:center;gap:9px;flex-shrink:0}
.seg{display:flex;gap:3px;background:#101018;border:1px solid var(--line2);
  border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--txt);color:#0a0a0c}
input[type=range]{width:120px;accent-color:var(--acc);cursor:pointer}
.val{font-size:12px;color:var(--dim);width:38px;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){
  .opc-linha{flex-direction:column;align-items:flex-start;gap:9px}
  .opc-ctrl{width:100%;justify-content:space-between}
  input[type=range]{flex:1;width:auto}
}

/* ---------- telas estreitas (celular / APK) ---------- */
@media(max-width:640px){
  body{font-size:14px}
  .wrap{padding:10px}
  .hud{grid-template-columns:repeat(3,1fr);gap:7px}
  .hud .card-b{padding:8px 9px}
  .hud .stat .lbl,.hud .lbl{font-size:9.5px;letter-spacing:.03em}
  .hud .big{font-size:15px}
  .card-h{padding:10px 12px}
  .card-b{padding:12px}
  .scene-tags{top:7px;left:7px;gap:4px}
  .scene-tags .tag{font-size:9.5px;padding:1px 7px}
  .scene-tags .tag.opc{display:none}       /* empresa e dia da semana: so no desktop */
  .bubble{font-size:10.5px;padding:5px 8px;max-width:58%;right:7px;top:7px}
  .act{min-height:0}
  .act .d{font-size:11px}
  .tabs{gap:5px}
  .tab{padding:6px 11px;font-size:12px}
  .log{max-height:260px}
  .veil{padding:10px;align-items:flex-start}
  .veil .card{margin:auto 0}
  .btn{padding:10px 14px}                  /* alvo de toque maior */
  .mg-cell{font-size:24px}
}
</style>
</head>
<body>
<div id="crt"></div>

<div id="app">
  <!-- Conteudo estatico: fica visivel ate o jogo desenhar por cima. Se voce ve
       esta tela parada, o navegador abriu o arquivo mas o script nao rodou. -->
  <div class="center">
    <div style="text-align:center;max-width:540px">
      <h1 style="font-size:clamp(26px,7vw,48px);font-weight:900;letter-spacing:-.03em">SIMULADOR CLT ES</h1>
      <p class="muted" style="margin-top:10px">Carregando o jogo...</p>
      <noscript>
        <div class="card" style="margin-top:18px;padding:18px;border-color:#7a2626">
          <b style="color:#ff5d5d">O JavaScript esta desativado neste navegador.</b>
          <p class="small muted" style="margin:8px 0 0">O jogo inteiro roda em JavaScript.
          Ative nas configuracoes do navegador e recarregue a pagina.</p>
        </div>
      </noscript>
    </div>
  </div>
</div>

<div id="layer"></div>

<script>
/* ===========================================================================
   Bloco de diagnostico. Fica separado de proposito: se o script principal
   tiver erro de sintaxe, ele nem chega a executar - mas este aqui ja rodou e
   captura o erro. Escrito em ES5 puro para funcionar ate em navegador velho.
   =========================================================================== */
(function () {
  window.__cltCarregou = false;

  function mostrar(titulo, detalhe) {
    var alvo = document.getElementById("app");
    if (!alvo) return;
    var caixa =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">' +
      '<div style="max-width:640px;width:100%;border:1px solid #7a2626;background:#16161c;border-radius:14px;padding:22px">' +
      '<h2 style="margin:0 0 10px;font-size:19px;color:#ff5d5d">' + titulo + "</h2>" +
      '<p style="margin:0 0 14px;color:#c5c5d0;font-size:14px">O jogo nao conseguiu iniciar. ' +
      "Copie o texto abaixo e mande pra quem esta te ajudando:</p>" +
      '<pre style="white-space:pre-wrap;word-break:break-word;background:#0a0a0c;border:1px solid #2a2a35;' +
      'border-radius:10px;padding:12px;color:#9a9aa8;font-size:12px;margin:0">' + detalhe + "</pre>" +
      '<p style="margin:14px 0 0;color:#6a6a78;font-size:12px">Se voce baixou o arquivo, confira que ele ' +
      "terminou de baixar inteiro (cerca de 127 KB) e que a extensao e <b>.html</b>.</p>" +
      "</div></div>";
    if (window.__cltCarregou) {
      var faixa = document.createElement("div");
      faixa.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#3a1414;" +
        "color:#ffb3b3;font:12px system-ui,sans-serif;padding:10px 14px;border-top:1px solid #7a2626";
      faixa.textContent = titulo + " - " + detalhe;
      document.body.appendChild(faixa);
    } else {
      alvo.innerHTML = caixa;
    }
  }

  function escapar(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  window.addEventListener("error", function (e) {
    var onde = e.lineno ? " (linha " + e.lineno + ", coluna " + e.colno + ")" : "";
    mostrar("Erro de JavaScript", escapar((e.message || "erro desconhecido") + onde +
      "\n\n" + navigator.userAgent));
  });

  /* Rede de seguranca: se em 5s o jogo nao tiver sinalizado que carregou e
     nenhum erro foi capturado, algo travou de forma silenciosa. */
  setTimeout(function () {
    if (!window.__cltCarregou && !document.querySelector("#app pre")) {
      mostrar("O jogo nao terminou de carregar",
        escapar("Nenhum erro foi reportado pelo navegador.\n\n" + navigator.userAgent));
    }
  }, 5000);
})();
</script>

<script>
"use strict";
/* ============================================================================
   SIMULADOR CLT ES — "O Peso da Carteira"
   Jogo 2D de sobrevivencia trabalhista capixaba, movido a dados (d6 / 2d6).
   Tudo em um arquivo so: sem React, sem Babel, sem CDN, sem fonte remota.
   ========================================================================== */

/* ------------------------------ utilitarios ------------------------------ */
const $  = (s, r = document) => r.querySelector(s);
const el = (t, cls, html) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const dN   = (f) => 1 + Math.floor(Math.random() * f);
const d6   = () => dN(6);
const d12  = () => dN(12);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const chance = (p) => Math.random() < p;
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const money = (n) => "R$ " + (Math.round(n * 100) / 100)
  .toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = (n) => "R$ " + Math.round(n).toLocaleString("pt-BR");
const esc = (s) => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const DIAS_SEMANA = ["Segunda", "Terca", "Quarta", "Quinta", "Sexta", "Sabado", "Domingo"];
const diaSemana   = (dia) => (dia - 1) % 7;            // dia 1 do mes = segunda
const ehFimDeSemana = (dia) => diaSemana(dia) >= 5;
const nomeDia     = (dia) => DIAS_SEMANA[diaSemana(dia)];

/* =========================== 1. REGIOES E CIDADES ==========================
   Rolagem 1 (d6): regiao do Espirito Santo.
   Rolagem 2 (d6): cidade dentro da regiao.
   dif = indice de dificuldade 0 (brutal) .. 4 (confortavel)
   sal = multiplicador local de salario | fare = preco da passagem
   scen = cenario 2D | heat = calor (0..3)
   ========================================================================== */
function C(nome, tag, dif, aluguel, sal, fare, scen, heat, setores, perk, debuff) {
  return { nome, tag, dif, aluguel, sal, fare, scen, heat, setores, perk, debuff };
}

/* ============================ 3. FOLHA DE PAGAMENTO ========================
   Tabelas didaticas com referencia de 2025. Nao servem de consultoria fiscal,
   servem pra voce sentir na pele o abismo entre bruto e liquido.
   ========================================================================== */
const SAL_MIN = 1518.00;

function calcINSS(bruto){
  const faixas = [[1518.00,0.075],[2793.88,0.09],[4190.83,0.12],[8157.41,0.14]];
  let ant = 0, total = 0;
  for (const [lim, aliq] of faixas){
    if (bruto > ant) total += (Math.min(bruto, lim) - ant) * aliq;
    ant = lim;
  }
  return Math.min(total, 951.63);
}
function calcIRRF(baseCalc){
  const b = Math.max(0, baseCalc - 607.20); // desconto simplificado
  const t = [[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],
             [4664.68,0.225,675.49],[Infinity,0.275,908.73]];
  for (const [lim, aliq, ded] of t) if (b <= lim) return Math.max(0, b * aliq - ded);
  return 0;
}

/* Monta o holerite do mes a partir do estado do jogo. */
function holerite(g){
  const st  = SETORES[g.setor];
  const cid = cidadeAtual(g);
  const base = g.salarioBase;
  const valorHora = base / st.jornada;

  const insal  = st.insal ? SAL_MIN * st.insal : 0;
  const peric  = st.peric ? base * 0.30 : 0;
  const extras = g.horasExtras * valorHora * 1.5;
  const noturno= g.horasNoturnas * valorHora * 0.20;
  const comiss = st.comissao ? Math.round(g.desempenho * (2 + g.nivel)) : 0;
  const gorjeta= st.gorjeta  ? Math.round(g.desempenho * 1.4 * (cid.heat >= 3 ? 1.3 : 1)) : 0;

  const diaria      = base / 30;
  const descFaltas  = g.faltas * diaria * 2;      // falta injustificada derruba o DSR junto
  const proventos   = base + insal + peric + extras + noturno + comiss + gorjeta;
  const brutoTrib   = Math.max(0, proventos - descFaltas);

  const inss = calcINSS(brutoTrib);
  const irrf = calcIRRF(brutoTrib - inss);
  const vt   = g.valeTransporte ? Math.min(base * 0.06, cid.fare * 2 * 22) : 0;
  const plano= g.planoSaude ? 129 : 0;
  const adiant = g.adiantamento;
  const parcela = Math.min(g.dividaParc, g.divida);

  const descontos = inss + irrf + vt + plano + adiant + parcela + descFaltas;
  const liquido   = proventos - descontos;
  const fgts      = brutoTrib * 0.08;

  return { base, insal, peric, extras, noturno, comiss, gorjeta, descFaltas,
           proventos, inss, irrf, vt, plano, adiant, parcela, descontos,
           liquido, fgts, brutoTrib, parcelaPaga: parcela };
}

function salarioDoCargo(regiao, cidade, setor, nivel){
  const cid = REGIOES[regiao].cidades[cidade];
  return Math.round(SETORES[setor].cargos[nivel].base * cid.sal / 10) * 10;
}

/* --------------------- criacao de personagem (os dados) -------------------
   Cinco rolagens de d12. Toda lista esta ordenada da pior para a melhor
   opcao, entao dado alto = lugar melhor, setor melhor, firma melhor.
   Dentro de cada numero ainda ha sorteio: a rolagem mira numa posicao da
   lista e escolhe entre os dois vizinhos, para 12 nunca cair sempre igual.
   ========================================================================== */
function escolherPorRolagem(lista, rolagem){
  const n = lista.length;
  if (n <= 1) return { item: lista[0], idx: 0 };
  const alvo = ((rolagem - 1) / 11) * (n - 1);
  const lo = Math.max(0, Math.round(alvo - 0.5));
  const hi = Math.min(n - 1, Math.round(alvo + 0.5));
  const idx = lo >= hi ? lo : rint(lo, hi);
  return { item: lista[idx], idx };
}

/* Setores da cidade ordenados do pior para o melhor emprego. */
const setoresDaCidade = (cid) =>
  cid.setores.slice().sort((a, b) => SETORES[a].q - SETORES[b].q);

function rolarPersonagem(){
  const r1 = d12(), reg = escolherPorRolagem(REGIOES, r1);
  const r2 = d12(), cid = escolherPorRolagem(reg.item.cidades, r2);
  const r3 = d12(), lista = setoresDaCidade(cid.item);
  const set = escolherPorRolagem(lista, r3);
  const r4 = d12(), emp = escolherPorRolagem(EMPRESAS[set.item], r4);
  const r5 = d12(), ori = escolherPorRolagem(ORIGENS, r5);
  return { r1, r2, r3, r4, r5, total: r1 + r2 + r3 + r4 + r5,
           regiao: reg.idx, cidade: cid.idx, setor: set.item,
           empresa: emp.item, empresaIdx: emp.idx,
           origem: ori.item, origemIdx: ori.idx };
}

  return Math.round(salarioDoCargo(g.regiao, g.cidade, g.setor, nivel)
                    * (g.empresaFator || 1) / 10) * 10;

/* ---------------------------- mutacoes basicas ---------------------------- */
function addLog(g, txt, tipo){
  g.log.unshift({ txt, tipo: tipo || "", dia: g.dia, mes: g.mes });
  if (g.log.length > 60) g.log.length = 60;
}

const CAMPOS_0_100 = ["energia","sanidade","fome","desempenho","qualificacao","rede","advertencias"];

function aplicar(g, e){
  if (!e) return;
  for (const k of CAMPOS_0_100) if (e[k]) g[k] = clamp(g[k] + e[k]);
  if (e.dinheiro){
    g.dinheiro = Math.max(0, g.dinheiro + e.dinheiro);
    if (e.dinheiro > 0) g.st.ganhoTotal += e.dinheiro; else g.st.gastoTotal += -e.dinheiro;
  }
  if (e.passagens) g.passagens = Math.max(0, g.passagens + e.passagens);
  if (e.horasExtras){ g.horasExtras += e.horasExtras; g.st.horasExtrasTotal += e.horasExtras; }
  if (e.horasNoturnas) g.horasNoturnas += e.horasNoturnas;
  if (e.advertencias > 0) g.st.advertenciasTotais += e.advertencias;
  if (e.fgts) g.fgts += e.fgts;
}

/* resumo textual de um delta, pra mostrar no log */
const NOMES_DELTA = { energia:"Energia", sanidade:"Sanidade", fome:"Fome", dinheiro:"R$",
  passagens:"Passagens", desempenho:"Desempenho", qualificacao:"Qualificacao",
  rede:"Rede", advertencias:"Advertencias", horasExtras:"Horas extras" };
function resumoDelta(e){
  if (!e) return "";
  const p = [];
  for (const k in NOMES_DELTA){
    if (!e[k]) continue;
    const v = e[k], sinal = v > 0 ? "+" : "";
    p.push(`<span class="${v>0?'c-ok':'c-bad'}">${sinal}${k==="dinheiro"?money0(v).replace("R$ ","R$"):v} ${NOMES_DELTA[k]}</span>`);
  }
  return p.join(" · ");
}

function checarFim(g){
  if (g.fim) return true;
  if (g.energia <= 0)      return fim(g, false, "EXAUSTAO TOTAL",
    "Seu corpo pediu arrego no meio da rotina. Voce apagou e nao levantou pro proximo turno.");
  if (g.sanidade <= 0)     return fim(g, false, "BURNOUT",
    "A mente entregou os pontos. Afastamento pelo INSS, CID F48, e um silencio muito grande.");
  if (g.advertencias >= 100) return fim(g, false, "DEMISSAO POR JUSTA CAUSA",
    "As advertencias empilharam ate virar processo interno. Sem aviso, sem multa, sem FGTS.");
  if (g.diasComFome >= 4)  return fim(g, false, "COLAPSO POR FOME",
    "Quatro dias de barriga vazia. O corpo cobrou a conta que o salario nao pagou.");
  return false;
}

function custoTurno(g){
  const cid = cidadeAtual(g);
  let en = 16, san = 5 + Math.round(g.nivel * 0.8), pass = 2;
  if (cid.debuff && /Energia/.test(cid.debuff)) en += 2;
  if (cid.debuff && /passagem a mais/.test(cid.debuff)) pass += 1;
  if (g.bike) pass = 0;
  if (g.moto) pass = 0;
  en += g.nivel;                       // cargo mais alto, mais desgaste mental
  if (setorAtual(g).insal) en += 2;
  return { en, san, pass };
}

/* No interior o curso sai mais caro: quase sempre e em outra cidade, com
   deslocamento e hospedagem por conta de quem estuda. */
function custoCurso(g, c){
  const cid = cidadeAtual(g);
  let v = c.custo * (1 + (2 - cid.dif) * 0.16);
  if (/cursos custam/.test(cid.perk || "")) v *= 0.8;
  return Math.round(v / 5) * 5;
}
function linhaReq(nome, atual, alvo, inverso){
  const ok = inverso ? atual < alvo : atual >= alvo;
  return `<div class="l"><span>${nome}</span><b class="${ok?'c-ok':'c-bad'}">${Math.round(atual)} / ${alvo}${ok?" ✓":""}</b></div>`;
}
function faltaParaPromocao(g){
  if (ehTopo(g)) return [];
  const r = reqPromo(g, g.nivel), f = [];
  if (g.desempenho   < r.des)    f.push("Desempenho");
  if (g.qualificacao < r.qual)   f.push("Qualificacao");
  if (g.rede         < r.rede)   f.push("Rede");
  if (g.diasNoCargo  < r.dias)   f.push("tempo no cargo");
  if (g.advertencias >= r.advMax) f.push("reduzir Advertencias");
  return f;
}
function acoesDisponiveis(g){
  return ACOES.filter(a => !a.quando || a.quando(g));
}

/* ========================= 8. EXECUCAO DE UMA ACAO ========================= */
function executarAcao(id){
  if (!G || G.screen !== "jogo" || G.popup) return;
  const a = ACOES.find(x => x.id === id);
  if (!a) return;
  if (a.quando && !a.quando(G)) return;
  if (G.pa < a.pa) { SOM.efeito("bloqueado"); flashAviso("Sem Pontos de Acao. Encerre o dia."); return; }
  const ok = a.pode ? a.pode(G) : true;
  if (ok !== true){ SOM.efeito("bloqueado");
    flashAviso(typeof ok === "string" ? ok : "Acao indisponivel."); return; }

  if (a.mg){                                   // acao com minigame
    const tipo = typeof a.mg === "function" ? a.mg(G) : a.mg;
    abrirMinigame(tipo, (score) => {
      G.pa -= a.pa;
      finalizarAcao(a, a.resolve(G, score));
    });
    return;
  }
  G.pa -= a.pa;
  finalizarAcao(a, a.run(G));
}

function finalizarAcao(a, res){
  const e = res.e || {};
  SOM.efeito(e.advertencias > 0 ? "advertencia"
           : e.dinheiro > 0 ? "dinheiro"
           : e.dinheiro < 0 ? "gasto" : "acao");
  aplicar(G, res.e);
  const det = resumoDelta(res.e);
  addLog(G, `<b>${esc(a.n)}</b> — ${res.txt}${det ? `<br><span class="tiny">${det}</span>` : ""}`, res.tipo || "");
  cenaAcao(a);
  if (res.popup) G.popup = res.popup;
  if (!checarFim(G)) checarConquistas(G);
  salvar(); render();
}

/* =========================== 9. VIRADA DE DIA ============================= */
function encerrarDia(){
  if (!G || G.screen !== "jogo" || G.popup) return;
  SOM.efeito("dormir");
  const g = G, cid = cidadeAtual(g);

  /* falta injustificada */
  if (!ehFimDeSemana(g.dia) && !g.trabalhouHoje){
    g.faltas++;
    aplicar(g, { advertencias:17, desempenho:-10, sanidade:-6 });
    addLog(g, "<b>Falta injustificada.</b> Advertencia registrada e desconto de DSR na folha.", "dn");
  }

  /* horas noturnas do setor */
  if (g.trabalhouHoje && setorAtual(g).noturno && chance(0.25)) g.horasNoturnas += 2;

  /* sono */
  const dfc = difJogo(g);
  let en = Math.round(23 * dfc.sono), san = 4;
  if (g.fome >= 80){ en -= 8; san -= 8; addLog(g, "Dormiu com fome. Acordou pior do que deitou.", "dn"); }
  if (g.sanidade < 25){ en -= 6; addLog(g, "Insonia de ansiedade. O teto ficou muito interessante.", "dn"); }
  if (/Sanidade ao dormir/.test(cid.perk||"")) san += 3;
  if (g.energia > 65) en -= 6;
  aplicar(g, { energia:en, sanidade:san, fome:16 });

  /* fome cronica */
  if (g.fome >= 90) g.diasComFome++; else g.diasComFome = 0;
  if (g.diasComFome === 2) addLog(g, "Dois dias praticamente sem comer. O corpo esta avisando.", "dn");

  /* sem passagem em dia util seguinte */
  if (g.passagens <= 0 && !g.bike && !g.moto && !ehFimDeSemana(g.dia + 1))
    addLog(g, "Cartao de transporte zerado. Amanha vai ter que ir a pe.", "dn");

  g.diasNoCargo++;
  aplicar(g, { desempenho:-1 });          // a regua da firma nunca para de correr
  if (checarFim(g)) { salvar(); render(); return; }

  /* evento aleatorio */
  if (chance(0.58 * dfc.eventos)){
    const disp = EVENTOS.filter(ev => !ev.quando || ev.quando(g));
    if (disp.length){
      const ev = pick(disp);
      const efeito = escalarDano(ev.e, dfc.dano);
      aplicar(g, efeito); if (ev.extra) ev.extra(g);
      addLog(g, `<b>${esc(ev.t)}</b> — ${esc(ev.x)}<br><span class="tiny">${resumoDelta(efeito)}</span>`, "ev");
      g.popup = { titulo: ev.t, em:"🎲", html:`<p>${esc(ev.x)}</p><p class="small">${resumoDelta(efeito)}</p>` };
    }
  }
  if (checarFim(g)) { salvar(); render(); return; }

  /* avanca */
  if (g.dia >= 30) fecharMes(g); else { g.dia++; iniciarDia(g); }
  if (!g.fim) SOM.efeito("acordar");
  checarConquistas(g);
  salvar(); render();
}

function iniciarDia(g){
  g.pa = g.paMax; g.trabalhouHoje = false; g.pediuAumento = false; g.atestado = false;
  const cid = cidadeAtual(g);

  if (g.dia === 5)  pagamento(g);
  if (g.dia === 8)  cobrarAluguel(g, cid);
  if (g.dia === 12) cobrarContas(g);
  if (ehFimDeSemana(g.dia)) addLog(g, `<b>${nomeDia(g.dia)}</b> — folga. Sem ponto, sem desconto.`, "");
}

function pagamento(g){
  const h = holerite(g);
  g.dinheiro = Math.max(0, g.dinheiro + h.liquido);
  g.st.ganhoTotal += Math.max(0, h.liquido);
  g.fgts += h.fgts;
  g.divida = Math.max(0, g.divida - h.parcelaPaga);
  if (g.divida <= 0){ g.divida = 0; g.dividaParc = 0; }
  g.horasExtras = 0; g.horasNoturnas = 0; g.faltas = 0; g.adiantamento = 0; g.usouVale = false;
  addLog(g, `<b>Salario caiu.</b> Bruto ${money0(h.proventos)} · Descontos ${money0(h.descontos)} · <b class="c-ok">Liquido ${money0(h.liquido)}</b>`, "mo");
  g.popup = { titulo:"Dia 5 — Holerite", em:"🧾", html: htmlHolerite(g, h) };
}

function cobrarAluguel(g, cid){
  if (g.mesesSemAluguel > 0){
    g.mesesSemAluguel--;
    addLog(g, "Voce ainda esta de favor. Sem aluguel este mes.", "up");
    return;
  }
  if (g.dinheiro >= g.aluguel){
    aplicar(g, { dinheiro:-g.aluguel, sanidade:2 });
    addLog(g, `Aluguel pago: ${money0(g.aluguel)}. Sobrou ${money0(g.dinheiro)}.`, "mo");
  } else {
    g.aluguelAtrasado = (g.aluguelAtrasado || 0) + 1;
    aplicar(g, { sanidade:-14 });
    addLog(g, `<b>Aluguel atrasado</b> (${g.aluguelAtrasado}x). O locador mandou audio.`, "dn");
    if (g.aluguelAtrasado >= 2)
      fim(g, false, "DESPEJO", `Dois meses sem pagar ${money0(g.aluguel)}. Suas coisas foram pra calcada e a carteira assinada nao segurou o teto.`);
    else
      g.popup = { titulo:"Aluguel atrasado", em:"⚠️",
        html:`<p>Voce nao tinha ${money0(g.aluguel)}. O locador deu um mes de prazo.</p><p class="small c-bad">Atrasar duas vezes seguidas = despejo.</p>` };
  }
}

function cobrarContas(g){
  const cid = cidadeAtual(g);
  let contas = Math.round(155 + cid.aluguel * 0.10 + (cid.heat >= 3 ? 50 : 0));
  if (g.dinheiro >= contas){
    aplicar(g, { dinheiro:-contas });
    addLog(g, `Contas do mes (luz, agua, internet): ${money0(contas)}.`, "mo");
  } else {
    aplicar(g, { sanidade:-10 });
    addLog(g, `Sem dinheiro pras contas (${money0(contas)}). Cortaram alguma coisa.`, "dn");
  }
}

/* ====================== 10. FECHAMENTO DE MES E CARREIRA ================== */
function fecharMes(g){
  const avaliacao = avaliar(g);
  g.mes++; g.dia = 1;
  iniciarDia(g);

  if (g.mes > 24 && !g.fim)
    return fim(g, true, "DOIS ANOS DE CASA",
      `Voce aguentou 24 meses como ${cargoAtual(g).n} em ${cidadeAtual(g).nome}. Tem FGTS de ${money0(g.fgts)} e uma historia pra contar.`);
  if (g.dinheiro >= 50000 && !g.fim)
    return fim(g, true, "LIBERDADE FINANCEIRA",
      `Voce juntou ${money0(g.dinheiro)}. Da pra pedir as contas e dormir tranquilo pela primeira vez.`);
  g.popup = avaliacao;
}

function avaliar(g){
  g.desempenho = clamp(g.desempenho);
  const cid = cidadeAtual(g);

  /* topo da carreira */
  if (ehTopo(g)){
    if (g.desempenho >= 70){
      fim(g, true, "TOPO DA CARREIRA",
        `Voce chegou a ${cargoAtual(g).n} na ${g.empresa}, em ${cid.nome}, e segurou a posicao. Salario de ${money0(g.salarioBase)}, ${g.st.promocoes} promocoes e ${g.st.diasTrabalhados} dias de ponto batido.`);
      return null;
    }
    return { titulo:"Avaliacao de Desempenho", em:"📋",
      html:`<p>Voce ja esta no topo da escada de <b>${esc(setorAtual(g).nome)}</b>. Segure Desempenho em 70+ no fim de um mes pra fechar a carreira com chave de ouro.</p>
            <p class="small">Desempenho atual: <b class="${g.desempenho>=70?'c-ok':'c-bad'}">${Math.round(g.desempenho)}</b></p>` };
  }

  const r = reqPromo(g, g.nivel);
  const falta = faltaParaPromocao(g);

  if (falta.length === 0){
    g.nivel++; g.st.promocoes++;
    const antes = g.salarioBase;
    g.salarioBase = Math.round(salarioBaseDe(g, g.nivel) * (1 + g.reajuste));
    g.diasNoCargo = 0;
    g.desempenho = 45; g.avaliacoesRuins = 0;
    const aluguelAntes = g.aluguel;
    g.aluguel = Math.round(g.aluguel * 1.12 / 10) * 10;   // subiu de cargo, subiu de endereco
    aplicar(g, { sanidade:12, rede:5 });
    addLog(g, `<b>PROMOVIDO!</b> Agora voce e ${esc(cargoAtual(g).n)}. Salario ${money0(antes)} → <b class="c-ok">${money0(g.salarioBase)}</b>.`, "up");
    SOM.efeito("promocao");
    addLog(g, `Voce mudou pra um lugar melhor: aluguel ${money0(aluguelAntes)} → <b class="c-bad">${money0(g.aluguel)}</b>.`, "dn");
    return { titulo:"PROMOCAO!", em:"🎉",
      html:`<p>Seu nome foi aprovado no comite. Voce agora e <b>${esc(cargoAtual(g).n)}</b>.</p>
        <div class="pay"><div class="h">O que muda</div>
          <div class="l"><span>Salario base</span><b class="c-ok">${money0(antes)} → ${money0(g.salarioBase)}</b></div>
          <div class="l"><span>Desempenho</span><b>reiniciado em 45 (a regua subiu)</b></div>
          <div class="l"><span>Aluguel</span><b class="c-bad">${money0(aluguelAntes)} → ${money0(g.aluguel)}</b></div>
          <div class="l"><span>Proximo cargo</span><b>${ehTopo(g)?"voce chegou ao topo":esc(setorAtual(g).cargos[g.nivel+1].n)}</b></div>
        </div>
        <p class="small muted" style="margin-top:10px">Cargo mais alto = turno mais desgastante. Bem-vindo.</p>` };
  }

  /* reprovado */
  if (g.desempenho < 32 || g.advertencias >= 80) g.avaliacoesRuins++;
  else g.avaliacoesRuins = 0;

  if (g.avaliacoesRuins >= 2) return demitir(g);

  SOM.efeito("negado");
  aplicar(g, { sanidade:-6 });
  addLog(g, `Avaliacao do mes ${g.mes}: sem promocao. Falta ${falta.join(", ")}.`, "dn");
  return { titulo:"Avaliacao de Desempenho", em:"📋",
    html:`<p>O comite avaliou seu mes. <b>Promocao negada.</b></p>
      <div class="pay"><div class="h">Requisitos para ${esc(setorAtual(g).cargos[g.nivel+1].n)}</div>
      ${linhaReq("Desempenho", g.desempenho, r.des)}
      ${linhaReq("Qualificacao", g.qualificacao, r.qual)}
      ${linhaReq("Rede de contatos", g.rede, r.rede)}
      ${linhaReq("Dias no cargo", g.diasNoCargo, r.dias)}
      ${linhaReq("Advertencias (max)", g.advertencias, r.advMax, true)}
      </div>
      <p class="small muted" style="margin-top:10px">Falta: <b>${falta.join(", ")}</b>. Tem mais um mes.</p>` };
}

/* demissao sem justa causa: nao e game over, e recomeco */
function demitir(g){
  const rescisao = Math.round(g.fgts * 1.4 + g.salarioBase);   // FGTS + multa 40% + aviso previo
  g.dinheiro += rescisao; g.st.ganhoTotal += rescisao; g.fgts = 0;
  g.st.recolocacoes++;
  const antigo = `${cargoAtual(g).n} na ${g.empresa}`;

  /* re-rola setor e empresa na mesma cidade (novos dados) */
  const cid = cidadeAtual(g);
  const r3 = d12(), set = escolherPorRolagem(setoresDaCidade(cid), r3);
  const r4 = d12(), emp = escolherPorRolagem(EMPRESAS[set.item], r4);
  g.setor = set.item;
  g.empresa = emp.item; g.empresaIdx = emp.idx; g.empresaFator = fatorEmpresa(emp.idx);
  g.recolocacaoRolagens = { r3, r4 };
  g.nivel = 0; g.diasNoCargo = 0; g.desempenho = 40; g.advertencias = 0;
  g.avaliacoesRuins = 0; g.reajuste = 0;
  g.salarioBase = salarioBaseDe(g, 0);
  g.rede = clamp(Math.round(g.rede * 0.75));
  g.horasExtras = 0; g.horasNoturnas = 0; g.faltas = 0; g.adiantamento = 0;
  aplicar(g, { sanidade:-18 });

  addLog(g, `<b>DEMITIDO SEM JUSTA CAUSA</b> de ${esc(antigo)}. Rescisao: ${money0(rescisao)}.`, "dn");
  addLog(g, `Recolocado: <b>${esc(cargoAtual(g).n)}</b> na ${esc(g.empresa)} (${esc(setorAtual(g).nome)}). Do zero de novo.`, "mo");
  checarFim(g);
  return { titulo:"DEMITIDO", em:"📉",
    html:`<p>Duas avaliacoes ruins seguidas. O RH agradeceu seus servicos com um aperto de mao frio.</p>
      <div class="pay"><div class="h">Rescisao</div>
        <div class="l"><span>FGTS + multa de 40% + aviso previo</span><b class="c-ok">${money0(rescisao)}</b></div>
        <div class="l"><span>Dados da recolocacao</span><b>setor ${r3} · empresa ${r4} (d12)</b></div>
        <div class="l"><span>Nova vaga (novos dados)</span><b>${esc(cargoAtual(g).n)}</b></div>
        <div class="l"><span>Nova empresa</span><b>${esc(g.empresa)}</b></div>
        <div class="l"><span>Setor</span><b>${esc(setorAtual(g).nome)}</b></div>
      </div>
      <p class="small muted" style="margin-top:10px">Sua Qualificacao continua com voce. A Rede perdeu 25%. O cargo voltou pro degrau 1.</p>` };
}

/* ============================= 11. CONQUISTAS ============================= */
const CONQUISTAS = [
  { id:"primeiro", n:"Primeiro Ponto", d:"Bateu o ponto pela primeira vez.", ok:(g)=>g.st.diasTrabalhados>=1 },
  { id:"promo1",   n:"Subiu um Degrau", d:"Conseguiu a primeira promocao.",  ok:(g)=>g.st.promocoes>=1 },
  { id:"promo3",   n:"Carreirista",     d:"Tres promocoes na mesma run.",    ok:(g)=>g.st.promocoes>=3 },
  { id:"extra40",  n:"Escravo do Banco de Horas", d:"40 horas extras acumuladas.", ok:(g)=>g.st.horasExtrasTotal>=40 },
  { id:"rico",     n:"Colchao Financeiro", d:"Chegou a R$10.000 guardados.", ok:(g)=>g.dinheiro>=10000 },
  { id:"limpo",    n:"Ficha Limpa",     d:"Fechou um mes com 0 advertencias.", ok:(g)=>g.mes>=2&&g.advertencias===0 },
  { id:"curso5",   n:"Eterno Estudante", d:"Cinco cursos concluidos.",       ok:(g)=>g.st.cursosFeitos>=5 },
  { id:"fenix",    n:"Fenix Capixaba",  d:"Foi demitido e voltou a subir.",  ok:(g)=>g.st.recolocacoes>=1&&g.st.promocoes>=1 },
];
function checarConquistas(g){
  for (const c of CONQUISTAS){
    if (!g.conquistas.includes(c.id) && c.ok(g)){
      g.conquistas.push(c.id);
      addLog(g, `🏆 <b>Conquista: ${c.n}</b> — ${c.d}`, "up");
    }
  }
}

/* ====================== 12. CONFIGURACOES DO JOGADOR ======================
   Guardadas separadas do save da partida: trocar de run nao reseta o volume.
   ========================================================================== */
const CFG_KEY = "simulador_clt_es_cfg";
const CFG = {
  musica: 40, efeitos: 70,
  crt: true, animacoes: true, fonte: "normal",
  dificuldade: "clt", abertura: true, confirmarDia: false,
};

function carregarConfig(){
  try {
    const bruto = localStorage.getItem(CFG_KEY);
    if (bruto) Object.assign(CFG, JSON.parse(bruto) || {});
  } catch (e) { /* localStorage bloqueado: fica no padrao */ }
  CFG.musica  = clamp(+CFG.musica  || 0, 0, 100);
  CFG.efeitos = clamp(+CFG.efeitos || 0, 0, 100);
}
function salvarConfig(){

}

}

/* A dificuldade fica gravada na partida: nao da pra trocar pro facil no
   ultimo dia pra escapar de uma derrota. */
const DIFICULDADES = {
  estagio: { n:"Estagio", d:"Mais folego pra aprender: comeca com mais dinheiro, eventos ruins doem menos e a promocao cobra menos.",
             dinheiro:1.7, dano:0.7, req:0.85, sono:1.15, eventos:0.85 },
  clt:     { n:"CLT", d:"O jogo como foi balanceado. Aperta, mas e justo.",
             dinheiro:1, dano:1, req:1, sono:1, eventos:1 },
  escala:  { n:"Escala 12x36", d:"Comeca duro: menos dinheiro, eventos mais frequentes e pesados, sono que nao recupera e regua de promocao mais alta.",
             dinheiro:0.52, dano:1.35, req:1.12, sono:0.85, eventos:1.2 },
};
const difJogo = (g) => DIFICULDADES[(g && g.dificuldade) || CFG.dificuldade] || DIFICULDADES.clt;

/* Requisitos de promocao ajustados pela dificuldade da partida e pelo porte da
   cidade: no interior a fila anda devagar porque nao ha vaga acima; na capital
   abre cargo o tempo todo. E o que da peso mecanico ao "dado alto e melhor". */
function reqPromo(g, nivel){
  const base = REQ_PROMO[nivel];
  if (!base) return null;
  const m = difJogo(g).req * (1.12 - cidadeAtual(g).dif * 0.045);
  return { des: Math.round(base.des * m), qual: Math.round(base.qual * m),
           rede: Math.round(base.rede * m), dias: Math.round(base.dias * m),
           advMax: Math.round(base.advMax / m) };
}

/* Escala o impacto de um evento conforme a dificuldade. So mexe no que
   prejudica: dificuldade facil nao deve encolher um Pix da vo. */
const PIOR_QUANDO_SOBE = { fome:1, advertencias:1 };
function escalarDano(e, mult){
  if (mult === 1 || !e) return e;
  const saida = {};
  for (const k in e){
    const v = e[k];
    if (typeof v !== "number"){ saida[k] = v; continue; }
    const ruim = PIOR_QUANDO_SOBE[k] ? v > 0 : v < 0;
    saida[k] = ruim ? Math.round(v * mult) : v;
  }
  return saida;
}

/* ============================== 13. AUDIO =================================
   Tudo sintetizado na hora com WebAudio: nenhum arquivo de som, nenhuma
   requisicao de rede. O jogo continua sendo um HTML solto que roda offline.
   ========================================================================== */
const nota = (n) => 440 * Math.pow(2, (n - 69) / 12);

/* Trilhas: cada linha e um passo de colcheia. 0 = silencio. */
const MUSICAS = {
  /* Menu: Am - F - C - G, arrastado, meio melancolico. */
  menu: { bpm: 84,
    baixo:  [45,0,0,45, 0,0,45,0, 41,0,0,41, 0,0,41,0, 40,0,0,40, 0,0,40,0, 43,0,0,43, 0,0,43,0],
    melodia:[69,0,72,0, 74,0,0,72, 69,0,0,0, 65,0,67,0, 64,0,67,0, 72,0,0,69, 67,0,0,0, 0,0,0,0],
    pad:    [57,0,0,0, 0,0,0,0, 53,0,0,0, 0,0,0,0, 52,0,0,0, 0,0,0,0, 55,0,0,0, 0,0,0,0],
    ritmo:  [1,0,0,0, 2,0,0,0, 1,0,0,0, 2,0,0,0, 1,0,0,0, 2,0,0,0, 1,0,1,0, 2,0,0,0] },
  /* Jogo: Dm repetitivo, discreto, ritmo de linha de producao. */
  jogo: { bpm: 104,
    baixo:  [38,0,38,0, 45,0,38,0, 41,0,41,0, 48,0,41,0, 36,0,36,0, 43,0,36,0, 40,0,40,0, 45,0,0,0],
    melodia:[0,0,0,0, 74,0,77,0, 0,0,0,0, 72,0,74,0, 0,0,0,0, 70,0,74,0, 0,0,0,0, 72,0,0,0],
    pad:    [50,0,0,0, 0,0,0,0, 53,0,0,0, 0,0,0,0, 48,0,0,0, 0,0,0,0, 52,0,0,0, 0,0,0,0],
    ritmo:  [1,0,3,0, 2,0,3,0, 1,0,3,0, 2,0,3,3, 1,0,3,0, 2,0,3,0, 1,1,3,0, 2,0,3,0] },
};

const SOM = {
  ctx:null, mestre:null, gMus:null, gSfx:null, ruidoBuf:null,
  desejada:null, tocando:null, timer:0, passo:0, proximo:0,

  /* Navegador so libera audio depois de um gesto do usuario. */
  iniciar(){
    if (this.ctx){ if (this.ctx.state === "suspended") this.ctx.resume(); this.retomar(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    this.mestre = this.ctx.createGain(); this.mestre.gain.value = 0.9;
    this.mestre.connect(this.ctx.destination);
    this.gMus = this.ctx.createGain(); this.gMus.connect(this.mestre);
    this.gSfx = this.ctx.createGain(); this.gSfx.connect(this.mestre);
    const n = Math.floor(this.ctx.sampleRate * 0.5);
    this.ruidoBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.ruidoBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.volumes();
    this.retomar();
  },
  volumes(){
    if (!this.ctx) return;
    this.gMus.gain.value = (CFG.musica / 100) * 0.26;
    this.gSfx.gain.value = (CFG.efeitos / 100) * 0.55;
    this.retomar();
  },
  retomar(){
    if (!this.ctx) return;
    if (CFG.musica <= 0) this.pararLoop();
    else if (this.desejada && this.tocando !== this.desejada) this.tocarMusica(this.desejada);
  },

  /* ------------------------------ sintese ------------------------------- */
  tom(freq, dur, o){
    if (!this.ctx) return;
    o = o || {};
    const t = this.ctx.currentTime + (o.atraso || 0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.tipo || "square";
    osc.frequency.setValueAtTime(freq, t);
    if (o.para) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.para), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol || 0.22), t + (o.ataque || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.destino || this.gSfx);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  batida(dur, o){
    if (!this.ctx || !this.ruidoBuf) return;
    o = o || {};
    const t = this.ctx.currentTime + (o.atraso || 0);
    const src = this.ctx.createBufferSource(); src.buffer = this.ruidoBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = o.filtro || "bandpass"; f.frequency.value = o.freq || 1400; f.Q.value = o.q || 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(o.vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.destino || this.gSfx);
    src.start(t); src.stop(t + dur + 0.02);
  },

  /* ---------------------------- efeitos ---------------------------------- */
  efeito(nome){
    if (!this.ctx || CFG.efeitos <= 0) return;
    const T = (f, d, o) => this.tom(f, d, o);
    switch (nome){
      case "clique":  T(520, .05, { vol:.10 }); break;
      case "aba":     T(760, .04, { tipo:"triangle", vol:.10 }); break;
      case "acao":    T(440, .06, { vol:.13 }); T(660, .07, { vol:.11, atraso:.06 }); break;
      case "bloqueado": T(150, .16, { tipo:"sawtooth", vol:.13, para:110 }); break;
      case "dado":
        for (let i = 0; i < 6; i++)
          this.batida(.05, { atraso:i * .075, freq:2200 + Math.random() * 1400, q:3, vol:.13 });
        break;
      case "dinheiro":
        T(880, .07, { tipo:"triangle", vol:.14 });
        T(1175, .07, { tipo:"triangle", vol:.13, atraso:.06 });
        T(1568, .13, { tipo:"triangle", vol:.12, atraso:.12 });
        break;
      case "gasto":   T(420, .22, { tipo:"sine", vol:.14, para:190 }); break;
      case "dormir":  T(330, .5, { tipo:"sine", vol:.13, para:110 }); break;
      case "acordar":
        T(523, .09, { tipo:"triangle", vol:.11 });
        T(659, .09, { tipo:"triangle", vol:.11, atraso:.09 });
        T(784, .16, { tipo:"triangle", vol:.11, atraso:.18 });
        break;
      case "popup":   T(620, .05, { tipo:"triangle", vol:.09 });
                      T(830, .07, { tipo:"triangle", vol:.08, atraso:.05 }); break;
      case "advertencia":
        T(300, .11, { tipo:"square", vol:.15 });
        T(300, .13, { tipo:"square", vol:.15, atraso:.17 });
        break;
      case "acerto":  T(1200, .05, { vol:.12 }); T(1760, .07, { vol:.10, atraso:.045 }); break;
      case "falha":   T(200, .13, { tipo:"square", vol:.12, para:140 });
                      this.batida(.1, { freq:400, vol:.1 }); break;
      case "promocao":
        [523, 659, 784, 1047].forEach((f, i) =>
          T(f, .16, { tipo:"triangle", vol:.15, atraso:i * .1 }));
        T(1319, .5, { tipo:"triangle", vol:.12, atraso:.42 });
        T(1047, .5, { tipo:"sine", vol:.08, atraso:.42 });
        break;
      case "negado":  T(392, .18, { tipo:"sawtooth", vol:.12 });
                      T(311, .3, { tipo:"sawtooth", vol:.12, atraso:.17 }); break;
      case "vitoria":
        [523, 659, 784, 1047, 1319].forEach((f, i) =>
          T(f, .18, { tipo:"triangle", vol:.16, atraso:i * .12 }));
        T(1568, .8, { tipo:"triangle", vol:.14, atraso:.62 });
        break;
      case "derrota":
        T(392, .35, { tipo:"sawtooth", vol:.15, para:330 });
        T(294, .45, { tipo:"sawtooth", vol:.15, atraso:.3, para:247 });
        T(196, .9, { tipo:"sine", vol:.16, atraso:.7, para:98 });
        break;
      case "abertura":
        T(392, .5, { tipo:"sine", vol:.1 });
        T(587, .5, { tipo:"sine", vol:.09, atraso:.1 });
        T(784, .9, { tipo:"sine", vol:.1, atraso:.2 });
        break;
    }
  },

  /* ----------------------------- trilha ---------------------------------- */
  tocarMusica(nomeTrilha){
    this.desejada = nomeTrilha;
    if (!this.ctx || CFG.musica <= 0 || !MUSICAS[nomeTrilha]){ this.pararLoop(); return; }
    if (this.tocando === nomeTrilha && this.timer) return;
    this.pararLoop();
    this.tocando = nomeTrilha; this.passo = 0;
    this.proximo = this.ctx.currentTime + 0.08;
    this.timer = setInterval(() => this.agendar(), 25);
  },
  pararMusica(){ this.desejada = null; this.pararLoop(); },
  pararLoop(){ if (this.timer) clearInterval(this.timer); this.timer = 0; this.tocando = null; },

  /* Agendamento com antecedencia: o setInterval so enfileira, quem toca no
     tempo certo e o relogio do proprio WebAudio. */
  agendar(){
    const m = MUSICAS[this.tocando];
    if (!m || !this.ctx){ this.pararLoop(); return; }
    const passoDur = 60 / m.bpm / 2;
    let guarda = 0;
    while (this.proximo < this.ctx.currentTime + 0.16 && guarda++ < 40){
      const i = this.passo % m.baixo.length;
      const dt = this.proximo - this.ctx.currentTime;
      if (dt >= 0){
        if (m.baixo[i])   this.tom(nota(m.baixo[i]),   passoDur * 1.7,
                            { tipo:"triangle", vol:.22, atraso:dt, destino:this.gMus });
        if (m.melodia[i]) this.tom(nota(m.melodia[i]), passoDur * 1.5,
                            { tipo:"square", vol:.10, atraso:dt, destino:this.gMus });
        if (m.pad[i])     this.tom(nota(m.pad[i]),     passoDur * 7,
                            { tipo:"sine", vol:.10, atraso:dt, ataque:.15, destino:this.gMus });
        const r = m.ritmo[i];
        if (r === 1) this.tom(70, .12, { tipo:"sine", vol:.28, para:42, atraso:dt, destino:this.gMus });
        if (r === 2) this.batida(.13, { freq:1900, q:.9, vol:.14, atraso:dt, destino:this.gMus });
        if (r === 3) this.batida(.04, { freq:6500, q:2, vol:.05, atraso:dt, destino:this.gMus });
      }
      this.proximo += passoDur;
      this.passo++;
    }
  },
};

  limparRolagem();
  rolagemAtual = rolarPersonagem();
  rolUI = { etapa:0, girando:true, timers:[], giro:dN(12) };
  telaRolagem();
  girarDado();
}

/* Gira o dado da etapa atual, para, revela e chama a proxima. */
function girarDado(){
  const flick = setInterval(() => {
    rolUI.giro = dN(12);
    const el = document.getElementById("dadoAtivo");
    if (el) el.textContent = rolUI.giro;
  }, 55);
  rolUI.timers.push(flick);

  rolUI.timers.push(setTimeout(() => {
    clearInterval(flick);
    rolUI.girando = false;
    SOM.efeito("dado");
    telaRolagem();
    rolUI.timers.push(setTimeout(() => {
      rolUI.etapa++;
      if (rolUI.etapa < ETAPAS_ROL.length){
        rolUI.girando = true; telaRolagem(); girarDado();
      } else {
        SOM.efeito("acordar"); telaRolagem();
      }
    }, 460));
  }, 800));
}

function pularRolagem(){
  limparRolagem();
  rolUI.etapa = ETAPAS_ROL.length; rolUI.girando = false;
  telaRolagem();
}

function classificarSorte(total){
  if (total <= 15) return { n:"Azar de doer", c:"var(--bad)" };
  if (total <= 25) return { n:"Vida dura", c:"var(--warn)" };
  if (total <= 35) return { n:"Na media capixaba", c:"var(--dim)" };
  if (total <= 45) return { n:"Sorte boa", c:"var(--blue)" };
  return { n:"Sorte grande", c:"var(--ok)" };
}

function telaRolagem(){
  const r = rolagemAtual;
  if (!r) return;
  const pronto = rolUI.etapa >= ETAPAS_ROL.length;
  const valores = [r.r1, r.r2, r.r3, r.r4, r.r5];

  const linhas = ETAPAS_ROL.map((et, i) => {
    const revelado = i < rolUI.etapa || pronto;
    const ativo = i === rolUI.etapa && !pronto;
    const v = revelado ? valores[i] : (ativo && rolUI.girando ? rolUI.giro : "?");
    const cor = revelado ? corDado(valores[i]) : (ativo ? "var(--acc)" : "#26262f");
    const escuro = revelado || ativo;
    return `<div class="rol-linha ${escuro ? "" : "apagada"}">
      <div class="d12 ${ativo && rolUI.girando ? "girando" : ""}" style="background:${cor}"
           ${ativo ? 'id="dadoAtivo"' : ""}>${v}</div>
      <div class="rol-txt">
        <div class="rol-rot">${et.ico} ${et.rot}</div>
        ${revelado
          ? `<div class="rol-res">${esc(et.txt(r))}</div>
             <div class="rol-sub">${esc(et.sub(r))}</div>`
          : `<div class="rol-res" style="color:var(--dim2)">${ativo ? "rolando..." : "aguardando"}</div>`}
      </div>
    </div>`;
  }).join("");

  const cid = REGIOES[r.regiao].cidades[r.cidade];
  const st = SETORES[r.setor];
  const sal = Math.round(salarioDoCargo(r.regiao, r.cidade, r.setor, 0) * fatorEmpresa(r.empresaIdx) / 10) * 10;
  const sorte = classificarSorte(r.total);

  app().innerHTML = `
  <div class="center"><div class="stack" style="width:100%;max-width:640px">
    <div style="text-align:center">
      <h2 style="font-size:24px;font-weight:900">A SORTE ESTA LANCADA</h2>
      <p class="small muted" style="margin-top:6px">Cinco dados de doze faces, um de cada vez.
        Quanto maior o numero, melhor o que vem — e dentro de cada numero ainda ha sorteio.</p>
    </div>

    <div class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:4px">
      ${linhas}
    </div></div>

    ${pronto ? `
      <div class="card"><div class="card-b">
        <div class="pay">
          <div class="h">Seu contrato inicial (sempre o degrau mais baixo)</div>
          <div class="l"><span>Cargo</span><b>${esc(st.cargos[0].n)}</b></div>
          <div class="l"><span>Salario base</span><b class="c-ok">${money0(sal)}</b></div>
          <div class="l"><span>Aluguel</span><b class="c-bad">${money0(cid.aluguel)}</b></div>
          <div class="l"><span>Passagem</span><b>${money(cid.fare)}</b></div>
          <div class="l"><span>Escada de carreira</span><b>${st.cargos.length} cargos ate ${esc(st.cargos[st.cargos.length-1].n)}</b></div>
          <div class="l tot"><span>Soma dos dados</span>
            <b style="color:${sorte.c}">${r.total} de 60 — ${sorte.n}</b></div>
        </div>
        ${cid.perk   ? `<p class="small c-ok" style="margin-top:10px">▲ ${esc(cid.perk)}</p>` : ""}
        ${cid.debuff ? `<p class="small c-bad" style="margin:4px 0 0">▼ ${esc(cid.debuff)}</p>` : ""}
      </div></div>
      <div class="flex" style="justify-content:center">
        <button class="btn btn-p btn-lg" data-go="aceitar">ASSINAR A CARTEIRA</button>
        <button class="btn btn-lg" data-go="rolar">🎲 ROLAR DE NOVO</button>
        <button class="btn btn-lg" data-go="menu">VOLTAR</button>
      </div>`
    : `<div class="flex" style="justify-content:center">
         <button class="btn" data-go="pularRolagem">Pular animacao</button>
       </div>`}
  </div></div>`;
}

  const ok = a.pode ? a.pode(g) : true;
  const semPA = g.pa < a.pa;

  const motivo = semPA ? "Sem PA suficiente" : (typeof ok === "string" ? ok : "");
  return `<button class="btn act" data-act="${a.id}" ${bloq?"disabled":""} title="${esc(motivo)}">
    <span class="t"><span class="em">${a.em}</span>${esc(a.n)}</span>
    <span class="d">${esc(a.d)}${motivo?` <span class="c-bad">— ${esc(motivo)}</span>`:""}</span>
    <span class="m"><span class="chip pa">${a.pa} PA</span>${a.mg?`<span class="chip">minigame</span>`:""}</span>
  </button>`;
}

function render(){

  if (!G || G.screen === "menu") { SOM.tocarMusica("menu"); telaMenu(); pintarLayer(); return; }
  if (G.screen === "rolagem")    { SOM.tocarMusica("menu"); telaRolagem(); pintarLayer(); return; }
  if (G.screen === "vitoria" || G.screen === "derrota"){
    SOM.pararMusica(); telaFim(); pintarLayer(); return;

  SOM.tocarMusica("jogo");
  telaJogo(); pintarLayer();
}

let ultimoPopup = null;
function pintarLayer(){
  const L = layer();
  if (L.dataset.mg) return;             // modal aberto (opcoes, ajuda, minigame) tem prioridade
  if (G && G.popup){
    if (G.popup !== ultimoPopup){ SOM.efeito("popup"); ultimoPopup = G.popup; }
    const p = G.popup;
    L.innerHTML = `<div class="veil"><div class="card">
      <div class="card-h"><h3 style="color:var(--txt);font-size:16px;text-transform:none">${p.em||"📌"} ${esc(p.titulo)}</h3></div>
      <div class="card-b stack">${p.html || `<p>${esc(p.texto||"")}</p>`}
      <button class="btn btn-p btn-block" data-go="fecharPopup">ENTENDIDO</button></div>
    </div></div>`;
  } else {
    ultimoPopup = null;
    L.innerHTML = "";
  }
}

                   : "Nenhuma partida salva no momento."; })(),
                 `<button class="btn small btn-bad" data-go="apagarPartida">Apagar</button>`)}
      ${linhaOpc("Restaurar padroes", "Volta todas as opcoes acima ao original.",
                 `<button class="btn small" data-go="resetCfg">Restaurar</button>`)}

      <div class="opc-grupo">Teclado</div>
      <div class="pay">
        <div class="l"><span>1 a 5</span><b>trocar de aba</b></div>
        <div class="l"><span>Espaco</span><b>encerrar o dia</b></div>
        <div class="l"><span>Enter ou Esc</span><b>fechar aviso</b></div>
      </div>

      <div class="opc-grupo">Sobre</div>
      <p class="small muted" style="margin:0">
        <b>Simulador CLT ES — O Peso da Carteira</b><br>
        Um jogo feito pela <b class="c-acc">D.F.B.G PRODUCTIONS</b>.<br>
