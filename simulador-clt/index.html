      </p>
    </div>
  </div></div>`;
}

/* ============================ 15. CENA 2D (CANVAS) ========================
   Pixel art desenhada por codigo: ceu por periodo do dia, skyline conforme o
   cenario da cidade, chuva/calor, onibus passando e o boneco reagindo.
   ========================================================================== */
const Cena = { raf:0, t:0, modo:"casa", bolha:"", bolhaAte:0, passo:0, onibus:-260, chuva:[] };
const CEUS = {
  manha:      ["#7fb6d9","#cfe8f5","#ffe9c4"],
  tarde:      ["#4a7fb5","#f0b26b","#ffd9a0"],
  noite:      ["#1b2140","#3a3a6b","#6b4a72"],
  madrugada:  ["#080a18","#141a35","#232a4d"],
};
const FASES = ["manha","tarde","noite","madrugada"];

function faseDoDia(g){ return FASES[clamp(g.paMax - g.pa, 0, 3)]; }

/* Em tela estreita o canvas passa a 540x300: mesma altura de desenho, menos
   largura, entao a cena aparece bem mais alta em vez de virar uma tira fina. */
function ajustarCanvas(cv){
  const caixa = cv.parentElement ? cv.parentElement.clientWidth : 960;
  const alvo = caixa > 0 && caixa < 560 ? 540 : 960;
  if (cv.width !== alvo){ cv.width = alvo; cv.height = 300; }
}

function iniciarCena(){
  cancelAnimationFrame(Cena.raf);
  const cv = document.getElementById("scene");
  if (!cv) return;
  ajustarCanvas(cv);
  const loop = () => {
    const c = document.getElementById("scene");
    if (!c || !G || G.screen !== "jogo"){ Cena.raf = 0; return; }
    ajustarCanvas(c);
    Cena.t += 1;
    desenharCena(c);
    Cena.raf = requestAnimationFrame(loop);
  };
  Cena.raf = requestAnimationFrame(loop);
}

function cenaAcao(a){
  Cena.modo = a.cat === "trabalho" ? "trabalho"
            : a.cat === "casa" ? "casa"
            : a.cat === "carreira" ? "estudo" : "rua";
  Cena.passo = 60;
  Cena.bolha = a.em + " " + a.n;
  Cena.bolhaAte = Date.now() + 2600;
  const b = document.getElementById("bubble");
  if (b){ b.textContent = Cena.bolha; b.classList.add("on"); }
}

function desenharCena(cv){
  const g = G, cid = cidadeAtual(g), st = setorAtual(g);
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, chao = H - 54;
  const fase = faseDoDia(g);
  const [c1, c2, c3] = CEUS[fase];

  /* ceu */
  const grad = ctx.createLinearGradient(0, 0, 0, chao);
  grad.addColorStop(0, c1); grad.addColorStop(0.6, c2); grad.addColorStop(1, c3);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, chao);

  /* sol / lua */
  const noturno = fase === "noite" || fase === "madrugada";
  const astroX = W * 0.84;
  ctx.fillStyle = noturno ? "#e8e8f0" : "#fff3b0";
  ctx.beginPath(); ctx.arc(astroX, 62, noturno ? 22 : 30, 0, Math.PI * 2); ctx.fill();
  if (noturno){
    ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(astroX - 10, 54, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    for (let i = 0; i < 40; i++){
      const x = (i * 137.5) % W, y = (i * 61.8) % (chao * 0.6);
      ctx.fillRect(x, y, 2, 2);
    }
  }

  /* nuvens */
  ctx.fillStyle = "rgba(255,255,255,.5)";
  for (let i = 0; i < 3; i++){
    const x = ((Cena.t * 0.25 + i * 340) % (W + 240)) - 120;
    const y = 40 + i * 26;
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, 7); ctx.arc(x + 22, y + 4, 15, 0, 7); ctx.arc(x - 20, y + 6, 13, 0, 7);
    ctx.fill();
  }

  desenharSkyline(ctx, W, chao, cid.scen, noturno, Cena.t);

  /* chao */
  ctx.fillStyle = noturno ? "#191922" : "#2c2c33";
  ctx.fillRect(0, chao, W, H - chao);
  ctx.fillStyle = noturno ? "#23232e" : "#3a3a44";
  ctx.fillRect(0, chao, W, 5);
  ctx.fillStyle = "#5a5a66";                                   // faixa da rua
  for (let x = (Cena.t * 1.2) % 60; x < W; x += 60) ctx.fillRect(x, chao + 26, 30, 3);

  /* onibus passando */
  Cena.onibus += 2.4;
  if (Cena.onibus > W + 300) Cena.onibus = -320 - Math.random() * 900;
  if (Cena.onibus > -260) desenharOnibus(ctx, Cena.onibus, chao - 6, noturno);

  /* calor e chuva */
  if (cid.heat >= 3 && !noturno){
    ctx.strokeStyle = "rgba(255,200,120,.28)"; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++){
      const y = chao - 30 - i * 12;
      ctx.beginPath();
      for (let x = 0; x < W; x += 12)
        ctx.lineTo(x, y + Math.sin((x + Cena.t * 2 + i * 40) / 22) * 3);
      ctx.stroke();
    }
  }

  desenharBoneco(ctx, W, chao, st, g, noturno);

  /* vinheta */
  const vg = ctx.createRadialGradient(W/2, chao*0.7, H*0.3, W/2, chao*0.7, W*0.7);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  /* bolha some sozinha */
  if (Cena.bolhaAte && Date.now() > Cena.bolhaAte){
    const b = document.getElementById("bubble");
    if (b) b.classList.remove("on");
    Cena.bolhaAte = 0;
  }
}

function desenharSkyline(ctx, W, chao, scen, noturno, t){
  const escuro = noturno ? "#12121c" : "#3a4152";
  const medio  = noturno ? "#1a1a28" : "#4c5468";
  ctx.fillStyle = escuro;

  if (scen === "metro" || scen === "ind" || scen === "porto"){
    for (let i = 0; i < Math.ceil(W / 62); i++){
      const x = i * 62, h = 60 + ((i * 53) % 90);
      ctx.fillStyle = i % 2 ? escuro : medio;
      ctx.fillRect(x, chao - h, 52, h);
      if (noturno){
        ctx.fillStyle = "rgba(255,214,102,.72)";
        for (let a = 0; a < 4; a++) for (let b = 0; b < Math.floor(h/22); b++)
          if ((i * 7 + a * 3 + b * 5) % 4 !== 0) ctx.fillRect(x + 8 + a * 11, chao - h + 10 + b * 20, 6, 8);
      }
    }
    if (scen === "ind"){                                    /* chamines com fumaca */
      ctx.fillStyle = escuro;
      for (const cx of [0.15, 0.49, 0.79].map(f => Math.round(W * f))){
        ctx.fillRect(cx, chao - 170, 26, 170);
        ctx.fillStyle = "rgba(200,200,210,.20)";
        for (let s = 0; s < 5; s++){
          const y = chao - 178 - s * 22 - (t * 0.4 % 22);
          ctx.beginPath(); ctx.arc(cx + 13 + Math.sin((y + t) / 30) * 10, y, 10 + s * 3, 0, 7); ctx.fill();
        }
        ctx.fillStyle = escuro;
      }
    }
    if (scen === "porto"){                                   /* guindastes */
      ctx.strokeStyle = "#7a4a2a"; ctx.lineWidth = 6;
      for (const cx of [0.23, 0.63].map(f => Math.round(W * f))){
        ctx.beginPath(); ctx.moveTo(cx, chao); ctx.lineTo(cx, chao - 150);
        ctx.lineTo(cx + 110, chao - 150); ctx.moveTo(cx + 70, chao - 150);
        ctx.lineTo(cx + 70, chao - 90); ctx.stroke();
      }
      ctx.fillStyle = "#b8543a";
      for (let i = 0; i < Math.ceil(W / 90); i++) ctx.fillRect(60 + i * 90, chao - 26, 74, 26);
    }
  } else if (scen === "praia"){
    const mar = ctx.createLinearGradient(0, chao - 120, 0, chao);
    mar.addColorStop(0, noturno ? "#12294a" : "#2e7fb8");
    mar.addColorStop(1, noturno ? "#0a1830" : "#1d5c8f");
    ctx.fillStyle = mar; ctx.fillRect(0, chao - 120, W, 120);
    ctx.fillStyle = "rgba(255,255,255,.35)";
    for (let i = 0; i < 12; i++){
      const y = chao - 110 + i * 9;
      ctx.fillRect(((i * 90 + t * (0.6 + i * 0.06)) % (W + 120)) - 60, y, 40, 2);
    }
    ctx.fillStyle = noturno ? "#c9b98a" : "#e8d9a8";
    ctx.fillRect(0, chao - 16, W, 16);
    ctx.fillStyle = escuro;                                  /* coqueiros */
    for (const cx of [0.09, 0.31, 0.87].map(f => Math.round(W * f))){
      ctx.fillRect(cx, chao - 96, 8, 96);
      for (let a = -2; a <= 2; a++){
        ctx.beginPath(); ctx.moveTo(cx + 4, chao - 96);
        ctx.quadraticCurveTo(cx + 4 + a * 26, chao - 122, cx + 4 + a * 46, chao - 96 + Math.abs(a) * 8);
        ctx.lineWidth = 7; ctx.strokeStyle = escuro; ctx.stroke();
      }
    }
  } else if (scen === "serra"){
    for (let i = 0; i < Math.ceil(W / 230) + 1; i++){
      const cx = i * 230 - 60, h = 150 + (i % 3) * 45;
      ctx.fillStyle = i % 2 ? escuro : medio;
      ctx.beginPath(); ctx.moveTo(cx, chao); ctx.lineTo(cx + 130, chao - h);
      ctx.lineTo(cx + 270, chao); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = noturno ? "#0e1a12" : "#2c4a2e";        /* mata */
    for (let i = 0; i < Math.ceil(W / 34); i++){
      const x = i * 34, h = 26 + (i * 13) % 22;
      ctx.beginPath(); ctx.moveTo(x, chao); ctx.lineTo(x + 14, chao - h); ctx.lineTo(x + 28, chao); ctx.fill();
    }
  } else {                                                   /* campo */
    ctx.fillStyle = noturno ? "#14261a" : "#3d6b3d";
    ctx.beginPath(); ctx.moveTo(0, chao);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, chao - 60 - Math.sin(x / 130) * 28);
    ctx.lineTo(W, chao); ctx.fill();
    ctx.fillStyle = noturno ? "#1b3320" : "#4d8a4a";        /* pes de cafe */
    for (let i = 0; i < Math.ceil(W / 40); i++){
      const x = 20 + i * 40, y = chao - 20 - (i % 3) * 8;
      ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill();
      ctx.fillRect(x - 2, y, 4, 20);
    }
  }
}

function desenharOnibus(ctx, x, y, noturno){
  ctx.fillStyle = "#1f4f8f"; ctx.fillRect(x, y - 62, 190, 56);
  ctx.fillStyle = "#e8e8ee"; ctx.fillRect(x, y - 30, 190, 10);
  ctx.fillStyle = noturno ? "#f0d78a" : "#a8d8f0";
  for (let i = 0; i < 5; i++) ctx.fillRect(x + 12 + i * 35, y - 54, 26, 18);
  ctx.fillStyle = "#111"; 
  ctx.beginPath(); ctx.arc(x + 40, y - 4, 11, 0, 7); ctx.arc(x + 152, y - 4, 11, 0, 7); ctx.fill();
  if (noturno){ ctx.fillStyle = "rgba(255,240,180,.55)";
    ctx.beginPath(); ctx.moveTo(x + 190, y - 26); ctx.lineTo(x + 250, y - 40); ctx.lineTo(x + 250, y); ctx.closePath(); ctx.fill(); }
}

function desenharBoneco(ctx, W, chao, st, g, noturno){
  const base = { casa: W * 0.22, trabalho: W * 0.62, rua: W * 0.44, estudo: W * 0.30 }[Cena.modo] || W * 0.4;
  const andando = Cena.passo > 0;
  if (andando) Cena.passo--;
  const S = 2.1;                                              // escala do pixel art
  const x = Math.round(base + (andando ? Math.sin(Cena.t / 6) * 10 : 0));
  const y = Math.round(chao - 2 + Math.sin(Cena.t / 12) * 2);
  const humor = g.sanidade < 30 ? "#9a9aa2" : g.sanidade < 55 ? "#c9b28a" : "#e8b98f";
  const capacete = ["siderurgia","construcao","rochas","portuario","petroleo","celulose"].includes(g.setor);

  ctx.save(); ctx.translate(x, y); ctx.scale(S, S);
  const p = (dx, dy, w, h, cor) => { ctx.fillStyle = cor; ctx.fillRect(dx, -dy, w, h); };

  p(-8, 1, 16, 3, "rgba(0,0,0,.42)");                         // sombra no chao
  p(-6, 16, 5, 15, "#242833"); p(1, 16, 5, 15, "#242833");    // pernas
  p(-7, 3, 6, 3, "#15151c");  p(1, 3, 6, 3, "#15151c");       // sapatos
  p(-8, 30, 16, 15, st.cor);                                  // uniforme
  p(-8, 30, 16, 2, "rgba(255,255,255,.22)");                  // gola
  p(-11, 29, 3, 13, st.cor); p(8, 29, 3, 13, st.cor);         // bracos
  p(-10, 17, 3, 3, humor);   p(8, 17, 3, 3, humor);           // maos
  p(-2, 32, 4, 9, "rgba(0,0,0,.25)");                         // sombra do tronco
  p(-6, 44, 12, 13, humor);                                   // cabeca
  if (capacete){ p(-8, 47, 16, 4, "#ffd23f"); p(-6, 50, 12, 3, "#ffd23f"); }
  else          { p(-6, 45, 12, 4, "#2a2118"); }              // cabelo
  ctx.fillStyle = "#15151c";                                  // olhos
  ctx.fillRect(-4, -39, 2, 2); ctx.fillRect(2, -39, 2, 2);
  ctx.fillStyle = g.sanidade < 35 ? "#7a2020" : "#8a4a30";    // boca
  ctx.fillRect(-2, -35, 4, g.sanidade < 35 ? 1 : 2);
  if (g.energia < 30){                                        // gota de suor
    ctx.fillStyle = "rgba(150,205,255,.9)";
    ctx.fillRect(6, -44 + (Cena.t % 26) * 0.5, 2, 4);
  }
  if (g.sanidade < 30){                                       // nuvenzinha de desanimo
    ctx.fillStyle = "rgba(160,160,190,.45)";
    for (let i = 0; i < 3; i++)
      ctx.fillRect(-10 + i * 4, -58 - ((Cena.t / 8 + i * 5) % 8), 3, 3);
  }
  ctx.restore();
}

/* ============================== 16. MINIGAMES ============================= */
let mgTimers = [];
function limparMinigame(){ mgTimers.forEach(t => { clearInterval(t); clearTimeout(t); cancelAnimationFrame(t); }); mgTimers = []; }

function abrirMinigame(tipo, cb){
  limparMinigame();
  const L = layer(); L.dataset.mg = "1"; L._tecla = null;
  const encerrar = (score) => { limparMinigame(); fecharModal(); cb(clamp(score, 0, 1)); };
  ({ onibus: mgOnibus, meta: mgMeta, cliente: mgCliente, conferencia: mgConferencia }[tipo] || mgMeta)(L, encerrar);
}

function caixaMg(L, titulo, sub, corpo){
  L.innerHTML = `<div class="veil"><div class="card">
    <div class="card-h"><h3 style="color:var(--txt);text-transform:none;font-size:16px">${titulo}</h3>
      <span class="tag acc">minigame</span></div>
    <div class="card-b stack"><p class="small muted" style="margin:0">${sub}</p>${corpo}</div>
  </div></div>`;
  return L.querySelector(".card-b");
}

/* --- ONIBUS: pare o marcador na faixa verde 3 vezes --- */
function mgOnibus(L, fim){
  let rodada = 0, acertos = 0, pos = 0, dir = 1;
  const vel = 1.6 + (G ? (100 - G.energia) / 90 : 0.5);
  const larg = 26 - (G ? Math.floor(G.nivel * 1.5) : 0);
  const alvo = () => 12 + Math.random() * (100 - larg - 20);
  let zona = alvo();

  const b = caixaMg(L, "🏃 Correndo atras do onibus", "Pare o marcador dentro da faixa verde. Tres tentativas.",
    `<div style="position:relative;height:34px;border:1px solid var(--line2);border-radius:8px;background:#0d0d14;overflow:hidden">
      <div id="mgZona" style="position:absolute;top:0;bottom:0;background:rgba(61,220,132,.35);border-left:2px solid var(--ok);border-right:2px solid var(--ok)"></div>
      <div id="mgMark" style="position:absolute;top:0;bottom:0;width:4px;background:var(--acc)"></div>
    </div>
    <div class="flex" style="justify-content:space-between"><span class="small muted">Tentativa <b id="mgR">1</b>/3</span><span class="small">Acertos: <b id="mgA">0</b></span></div>
    <button class="btn btn-p btn-block btn-lg" id="mgGo">PARAR!</button>
    <button class="btn btn-block" id="mgQuit">Desistir</button>`);

  const zEl = b.querySelector("#mgZona"), mEl = b.querySelector("#mgMark");
  const upZona = () => { zEl.style.left = zona + "%"; zEl.style.width = larg + "%"; };
  upZona();
  const loop = () => {
    pos += dir * vel; if (pos > 100){ pos = 100; dir = -1; } if (pos < 0){ pos = 0; dir = 1; }
    mEl.style.left = pos + "%";
    mgTimers.push(requestAnimationFrame(loop));
  };
  mgTimers.push(requestAnimationFrame(loop));

  const tentar = () => {
    const pegou = pos >= zona && pos <= zona + larg;
    SOM.efeito(pegou ? "acerto" : "falha");
    if (pegou) acertos++;
    rodada++;
    if (rodada >= 3){ fim(acertos / 3); return; }
    zona = alvo(); upZona();
    b.querySelector("#mgR").textContent = rodada + 1;
    b.querySelector("#mgA").textContent = acertos;
  };
  b.querySelector("#mgGo").onclick = tentar;
  b.querySelector("#mgQuit").onclick = () => fim(acertos / 3 * 0.5);
  L._tecla = (e) => { if (e.code === "Space"){ e.preventDefault(); tentar(); } };
}

/* --- META: acerte as caixas antes do tempo acabar --- */
function mgMeta(L, fim){
  const alvoTotal = 10 + (G ? G.nivel * 2 : 0);
  let acertos = 0, tempo = 14, atual = -1;
  const b = caixaMg(L, "📦 Batendo a meta", `Clique nas caixas que acenderem. Meta: <b>${alvoTotal}</b> em 14 segundos.`,
    `<div class="flex" style="justify-content:space-between">
       <span class="small">Producao: <b id="mgP">0</b>/${alvoTotal}</span>
       <span class="small">Tempo: <b id="mgT">14</b>s</span></div>
     <div class="bar"><i id="mgBar" style="width:0%;background:var(--ok)"></i></div>
     <div class="mg-grid" id="mgGrid">${Array.from({length:9},(_,i)=>`<div class="mg-cell" data-i="${i}"></div>`).join("")}</div>
     <button class="btn btn-block" id="mgQuit">Parar agora</button>`);

  const cels = [...b.querySelectorAll(".mg-cell")];
  const acender = () => {
    cels.forEach(c => { c.className = "mg-cell"; c.textContent = ""; });
    atual = Math.floor(Math.random() * 9);
    cels[atual].className = "mg-cell on"; cels[atual].textContent = "📦";
  };
  acender();
  mgTimers.push(setInterval(acender, 850));
  b.querySelector("#mgGrid").onclick = (e) => {
    const c = e.target.closest(".mg-cell"); if (!c) return;
    if (atual < 0) return;                       // caixa ja conferida: espera a proxima acender
    if (+c.dataset.i === atual){
      SOM.efeito("acerto");
      acertos++; atual = -1;
      c.className = "mg-cell"; c.textContent = "✅";
      b.querySelector("#mgP").textContent = acertos;
      b.querySelector("#mgBar").style.width = Math.min(100, acertos / alvoTotal * 100) + "%";
      if (acertos >= alvoTotal) fim(1);
    } else { SOM.efeito("falha");
      c.className = "mg-cell bad"; acertos = Math.max(0, acertos - 1);
      b.querySelector("#mgP").textContent = acertos; }
  };
  mgTimers.push(setInterval(() => {
    tempo--; const t = b.querySelector("#mgT"); if (t) t.textContent = tempo;
    if (tempo <= 0) fim(acertos / alvoTotal);
  }, 1000));
  b.querySelector("#mgQuit").onclick = () => fim(acertos / alvoTotal);
}

/* --- CLIENTE: escolha a resposta que segura a paciencia --- */
const DIALOGOS = [
  { fala:"“Faz 40 minutos que eu espero! Voces nao respeitam ninguem!”",
    ops:[["Entendo sua frustracao. Vou resolver agora mesmo.",1],
         ["Senhor, o sistema esta lento, nao e culpa minha.",-1],
         ["Todo mundo espera, o senhor nao e especial.",-2]] },
  { fala:"“Quero falar com o seu supervisor. AGORA.”",
    ops:[["Posso chamar sim. Antes disso, me deixa tentar resolver?",1],
         ["Ele esta ocupado.",-1],
         ["Pode falar, mas ele vai dizer a mesma coisa.",-2]] },
  { fala:"“Voce esta rindo da minha cara?”",
    ops:[["De jeito nenhum. Estou aqui pra te ajudar.",1],
         ["Nao, e que a situacao e engracada.",-2],
         ["...", -1]] },
  { fala:"“Se nao resolver eu vou no Procon!”",
    ops:[["E um direito seu. Enquanto isso, vamos tentar resolver aqui.",1],
         ["Pode ir, nao vai adiantar.",-2],
         ["Nao precisa disso.",-1]] },
  { fala:"“Voce ta me enrolando desde ontem!”",
    ops:[["Vou te dar um prazo real agora e cumprir.",1],
         ["Nao fui eu que atendi ontem.",-1],
         ["Voce que nao entendeu direito.",-2]] },
];
function mgCliente(L, fim){
  const rodadas = [...DIALOGOS].sort(() => Math.random() - 0.5).slice(0, 3);
  let i = 0, paciencia = 60;
  const desenhar = () => {
    if (i >= rodadas.length || paciencia <= 0){ fim(clamp(paciencia, 0, 100) / 100); return; }
    const r = rodadas[i];
    const ops = [...r.ops].sort(() => Math.random() - 0.5);
    const b = caixaMg(L, "😤 Cliente dificil", `Rodada ${i+1}/3. Segure a paciencia dele acima de zero.`,
      `<div class="stat"><div class="lbl"><span>Paciencia do cliente</span><span class="mono">${paciencia}</span></div>
        <div class="bar"><i style="width:${clamp(paciencia)}%;background:${paciencia<35?'var(--bad)':'var(--warn)'}"></i></div></div>
       <p style="margin:10px 0 0;font-size:14.5px">${esc(r.fala)}</p>
       <div class="mg-opts">${ops.map((o,k)=>`<button class="btn" data-k="${k}">${esc(o[0])}</button>`).join("")}</div>`);
    b.querySelectorAll("[data-k]").forEach(btn => btn.onclick = () => {
      const v = ops[+btn.dataset.k][1];
      SOM.efeito(v > 0 ? "acerto" : "falha");
      paciencia = clamp(paciencia + (v > 0 ? 16 : v === -1 ? -18 : -32), 0, 100);
      i++; desenhar();
    });
  };
  desenhar();
}

/* --- CONFERENCIA: contas rapidas de carga / caixa --- */
function mgConferencia(L, fim){
  const total = 5; let i = 0, acertos = 0, resp = 0, prazo = null;
  const proxima = () => {
    if (i >= total){ fim(acertos / total); return; }
    const a = rint(6, 40), b2 = rint(3, 25), op = chance(0.5) ? "+" : "×";
    resp = op === "+" ? a + b2 : a * (b2 % 9 + 2);
    const mostra = op === "+" ? `${a} + ${b2}` : `${a} × ${(b2 % 9) + 2}`;
    const opcoes = [resp, resp + rint(1, 9), resp - rint(1, 9), resp + rint(10, 30)]
      .sort(() => Math.random() - 0.5);
    const box = caixaMg(L, "🧮 Conferencia de carga", `Item ${i+1}/${total}. Voce tem 6 segundos.`,
      `<div class="mg-num mono">${mostra}</div>
       <div class="bar"><i id="mgP2" style="width:100%;background:var(--acc);transition:width 6s linear"></i></div>
       <div class="mg-opts" style="margin-top:10px">${opcoes.map(o=>`<button class="btn" data-v="${o}">${o}</button>`).join("")}</div>`);
    requestAnimationFrame(()=>{ const p = box.querySelector("#mgP2"); if (p) p.style.width = "0%"; });
    box.querySelectorAll("[data-v]").forEach(btn => btn.onclick = () => {
      const certo = +btn.dataset.v === resp;
      SOM.efeito(certo ? "acerto" : "falha");
      if (certo) acertos++;
      clearTimeout(prazo); i++; proxima();
    });
    prazo = setTimeout(() => { i++; proxima(); }, 6100);
    mgTimers.push(prazo);
  };
  proxima();
}

/* =========================== 18. SAVE / LOAD ============================== */
function salvar(){
  try {
    if (!G || G.screen !== "jogo") return;
    const copia = { ...G, popup: null };
    localStorage.setItem(SAVE_KEY, JSON.stringify(copia));
  } catch (e) { /* localStorage bloqueado: o jogo segue sem save */ }
}
function carregar(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s.regiao !== "number" || !SETORES[s.setor]) return null;
    if (!REGIOES[s.regiao] || !REGIOES[s.regiao].cidades[s.cidade]) return null;
    s.popup = null; s.screen = "jogo";
    s.log = Array.isArray(s.log) ? s.log : [];
    s.conquistas = Array.isArray(s.conquistas) ? s.conquistas : [];
    return s;
  } catch (e) { return null; }
}
function apagarSave(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

/* =========================== 19. EVENTOS DE UI ============================ */

/* Chaves de configuracao que sao liga/desliga (chegam como "1"/"0"). */
const CFG_BOOL = { crt:1, animacoes:1, abertura:1, confirmarDia:1 };

/* O navegador so libera audio depois de um gesto. Primeiro toque/tecla arma tudo. */
function armarAudio(){
  SOM.iniciar();
  if (G && G.screen === "jogo") SOM.tocarMusica("jogo");
  else if (G && G.screen !== "splash") SOM.tocarMusica("menu");
}
document.addEventListener("pointerdown", armarAudio, { once:true });
document.addEventListener("keydown", armarAudio, { once:true });

document.addEventListener("input", (ev) => {
  const alvo = ev.target.closest("[data-cfg]");
  if (!alvo) return;
  const chave = alvo.dataset.cfg;
  CFG[chave] = clamp(+alvo.value, 0, 100);
  const rotulo = document.getElementById("val-" + chave);
  if (rotulo) rotulo.textContent = CFG[chave] + "%";
  aplicarConfig();
});
document.addEventListener("change", (ev) => {
  const alvo = ev.target.closest("[data-cfg='efeitos']");
  if (alvo) SOM.efeito("dinheiro");        // amostra pra ouvir o volume escolhido
});

document.addEventListener("click", (ev) => {
  const alvoSet = ev.target.closest("[data-set]");
  if (alvoSet){
    const corte = alvoSet.dataset.set.indexOf(":");
    const chave = alvoSet.dataset.set.slice(0, corte);
    const valor = alvoSet.dataset.set.slice(corte + 1);
    CFG[chave] = CFG_BOOL[chave] ? valor === "1" : valor;
    aplicarConfig(); SOM.efeito("clique");
    modalOpcoes();
    return;
  }

  const alvoAba = ev.target.closest("[data-aba]");
  if (alvoAba){ SOM.efeito("aba"); UI.aba = alvoAba.dataset.aba; render(); return; }

  const alvoAct = ev.target.closest("[data-act]");
  if (alvoAct && !alvoAct.disabled){ executarAcao(alvoAct.dataset.act); return; }

  const alvoGo = ev.target.closest("[data-go]");
  if (!alvoGo) return;
  const go = alvoGo.dataset.go;
  if (go !== "pularSplash") SOM.efeito("clique");

  switch (go){
    case "pularSplash": fecharSplash(); break;

    case "rolar":
      G = { screen:"rolagem" };
      SOM.tocarMusica("menu");
      iniciarRolagem(); pintarLayer();
      break;

    case "pularRolagem": pularRolagem(); break;

    case "aceitar":
      limparRolagem();
      G = novoJogo(rolagemAtual);
      UI.aba = "trabalho";
      G.popup = { titulo:"Carteira assinada", em:"📗",
        html:`<p>Bem-vindo a <b>${esc(cidadeAtual(G).nome)}</b>. Aluguel de <b>${money0(G.aluguel)}</b> vence dia 8, o salario cai dia 5.</p>
              <p class="small muted">Dificuldade desta partida: <b>${esc(difJogo(G).n)}</b>. Voce tem 4 Pontos de Acao por dia — comece batendo o ponto, e o unico jeito de subir Desempenho.</p>` };
      apagarSave(); salvar(); render();
      break;

    case "continuar": {
      const salvo = carregar();
      if (!salvo){ flashAviso("Nao ha jogo salvo."); return; }
      G = salvo; UI.aba = "trabalho"; render();
      break; }

    case "menu":
      limparRolagem();
      salvar(); cancelAnimationFrame(Cena.raf); Cena.raf = 0;
      G = { screen:"menu" }; render();
      break;

    case "dormir":
      if (CFG.confirmarDia && G && G.screen === "jogo" && G.pa > 0){ modalConfirmarDia(); break; }
      encerrarDia();
      break;
    case "dormirConfirma": fecharModal(); encerrarDia(); break;

    case "ajuda":  modalAjuda(); break;
    case "opcoes": modalOpcoes(); break;
    case "ficha":  if (G && G.screen === "jogo") modalFicha(); break;
    case "fecharAjuda": fecharModal(); break;

    case "fecharPopup":
      if (G) G.popup = null;
      pintarLayer();
      if (G && (G.screen === "vitoria" || G.screen === "derrota")) render();
      break;

    case "mudo": {
      const silenciado = CFG.musica === 0 && CFG.efeitos === 0;
      CFG.musica  = silenciado ? 40 : 0;
      CFG.efeitos = silenciado ? 70 : 0;
      aplicarConfig(); modalOpcoes();
      break; }

    case "apagarPartida":
      apagarSave();
      flashAviso("Partida salva apagada.");
      modalOpcoes();
      break;

    case "resetCfg":
      Object.assign(CFG, { musica:40, efeitos:70, crt:true, animacoes:true,
                           fonte:"normal", dificuldade:"clt", abertura:true, confirmarDia:false });
      aplicarConfig(); modalOpcoes(); render();
      break;
  }
});

function modalConfirmarDia(){
  const L = layer(); L.dataset.mg = "1";
  L.innerHTML = `<div class="veil"><div class="card">
    <div class="card-h"><h3 style="color:var(--txt);text-transform:none;font-size:16px">🌙 Encerrar o dia?</h3></div>
    <div class="card-b stack">
      <p style="margin:0">Voce ainda tem <b>${G.pa}</b> Ponto(s) de Acao hoje. Dormir agora joga fora o que sobrou.</p>
      <div class="flex">
        <button class="btn btn-p" data-go="dormirConfirma">Dormir mesmo assim</button>
        <button class="btn" data-go="fecharAjuda">Voltar</button>
      </div>
    </div></div></div>`;
}

document.addEventListener("keydown", (e) => {
  const L = layer();
  if (L.dataset.mg && L._tecla){ L._tecla(e); return; }
  if (G && G.screen === "splash" && (e.key === "Enter" || e.key === " " || e.key === "Escape")){
    e.preventDefault(); fecharSplash(); return;
  }
  if (G && G.popup && (e.key === "Enter" || e.key === "Escape")){
    G.popup = null; pintarLayer();
    if (G.screen === "vitoria" || G.screen === "derrota") render();
    return;
  }
  if (L.dataset.mg && e.key === "Escape"){ fecharModal(); return; }
  if (!G || G.screen !== "jogo" || L.innerHTML) return;
  if (e.key === " "){
    e.preventDefault();
    if (CFG.confirmarDia && G.pa > 0) modalConfirmarDia(); else encerrarDia();
  }
  if (e.key >= "1" && e.key <= "5"){
    const abas = ["trabalho","casa","cidade","carreira","grana"];
    SOM.efeito("aba"); UI.aba = abas[+e.key - 1]; render();
  }
});

/* ================================ 20. BOOT =============================== */
carregarConfig();
if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)
  CFG.animacoes = false;
aplicarConfig();

G = { screen: CFG.abertura ? "splash" : "menu" };
render();
window.__cltCarregou = true;   // avisa o bloco de diagnostico que deu tudo certo
</script>
