<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<canvas id="c" width="432" height="432"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const W=432,H=432;
// fundo
const g = ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#1b2140'); g.addColorStop(.55,'#2a2a3d'); g.addColorStop(1,'#101018');
ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
// skyline industrial
ctx.fillStyle='#0d0d16';
for(let i=0;i<9;i++){const x=i*50,h=70+((i*53)%80);ctx.fillRect(x,300-h,42,h);}
ctx.fillStyle='rgba(255,214,102,.85)';
for(let i=0;i<9;i++){const x=i*50,h=70+((i*53)%80);
  for(let a=0;a<2;a++)for(let b=0;b<Math.floor(h/28);b++)
    if((i*7+a*3+b*5)%4!==0)ctx.fillRect(x+8+a*18,300-h+10+b*26,8,10);}
// chao
ctx.fillStyle='#16161c'; ctx.fillRect(0,300,W,132);
ctx.fillStyle='#ffd23f'; ctx.fillRect(0,300,W,4);
// boneco pixel (mesmo estilo do jogo)
const S=4.0, x=216, y=296;
ctx.save(); ctx.translate(x,y); ctx.scale(S,S);
const p=(dx,dy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(dx,-dy,w,h);};
p(-6,16,5,15,'#242833'); p(1,16,5,15,'#242833');
p(-7,3,6,3,'#15151c');  p(1,3,6,3,'#15151c');
p(-8,30,16,15,'#c96f2f'); p(-8,30,16,2,'rgba(255,255,255,.22)');
p(-11,29,3,13,'#c96f2f'); p(8,29,3,13,'#c96f2f');
p(-10,17,3,3,'#e8b98f');  p(8,17,3,3,'#e8b98f');
p(-6,44,12,13,'#e8b98f');
p(-8,47,16,4,'#ffd23f'); p(-6,50,12,3,'#ffd23f');
ctx.fillStyle='#15151c'; ctx.fillRect(-4,-39,2,2); ctx.fillRect(2,-39,2,2);
ctx.fillStyle='#8a4a30'; ctx.fillRect(-2,-35,4,2);
ctx.restore();
// faixa CLT
ctx.fillStyle='rgba(10,10,14,.88)'; ctx.fillRect(0,336,W,66);
ctx.fillStyle='#ffd23f';
ctx.font='900 62px "DejaVu Sans", sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
ctx.letterSpacing='6px';
ctx.fillText('CLT ES',W/2,371);
// moldura
ctx.strokeStyle='#ffd23f'; ctx.lineWidth=8; ctx.strokeRect(4,4,W-8,H-8);
</script></body></html>
