# Publica o conteúdo do repositório no GitHub Pages automaticamente.
# Toda vez que algo entra na branch main, este robô do GitHub liga o Pages
# (se ainda não estiver ligado) e coloca o site no ar.
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite rodar na mão pelo botão "Run workflow"

# Permissões que o robô precisa para publicar o site
permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 1. baixa os arquivos do repositório
      - name: Pegar os arquivos
        uses: actions/checkout@v4

      # 2. liga o GitHub Pages caso ainda esteja desligado
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 3. empacota o repositório inteiro como site
      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 4. publica
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
